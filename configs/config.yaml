# customer-support — Customer-Support Pod
#
# A pod of digital employees + four human tiers that runs an inbound support
# ticket end to end: any channel -> case opened -> triaged (intent + priority,
# voice routed) -> sentiment (parallel) -> KB-grounded draft -> QA (PII/policy)
# -> human review -> SENT on the arrival channel -> live status, with a
# hash-chained WORM audit as the terminus.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every hand-off
# is a finished contract; nothing is sent on silence (a review nobody answers
# closes its Inbox card and the ticket records that no reply came); the
# finisher SENDS the real reply and fails closed; the WORM sink is the
# terminus. Systems (Zendesk / Slack / Twilio / Salesforce) are TOOLS or
# connector actors reached by agents — never mesh members, and the customer is
# never a member.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "customer-support"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

# 2.4.131 runtime block — the ONE non-default this pod genuinely needs: the
# KB-grounded response super-agent can plan/retrieve/verify over many sources
# and run long. The 2.4.131 default dropped 300s -> 90s; raise it back. (The
# `timeouts` block is REJECTED by <=2.4.130, so it must land WITH the 2.4.131
# floor, never before.)
timeouts:
  mesh_call_default_timeout_s: 120
  llm_hard_timeout_s: 300

# ═══════════════════════════════════════════════════════════════════
# EVENT BROKERS — the async ingestion surface (parallel to the per-channel
# entry points, which are synchronous API calls). At volume, point your
# channel webhooks (Slack Events API, inbound-email parser, chat widget)
# at a thin receiver that writes each message onto this stream; the
# coordinator listens and opens a case per event. DEV: a Redis stream
# (same Redis, no extra dependency). PROD: swap to Kafka/SQS.
# ═══════════════════════════════════════════════════════════════════
# brokers:
  # Day 0 this broker is off: create the vault connection 'support_events' on
  # Infrastructure → Brokers & queues → Redis Streams, then uncomment it and
  # its agents' listen_events — here before the first start, in Studio's YAML
  # editor after it (applies live, no restart).
  # support_events:
    # type: "redis_streams"
    # connection: support_events   # vault connection (Infrastructure → Brokers & queues → Redis Streams) holds the address
    # db: 1
  # PROD — channel webhooks -> SQS:
  # support_events:
  #   type: "sqs"
  #   region: "${AWS_REGION:us-east-1}"

# YAML-FIRST: agency/ carries exactly ONE per-agent module — the finisher
# reply_dispatcher_agent.py (auto-binds via agent_type programmatic + matching
# <name>.py). The other Python is the WORM sink (agency/_shared/audit_logger.py,
# registered in main.py) and the day-0 dev-store tools (agency/tools.py +
# agency/_shared/store.py). Everything else is pure YAML.
auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# ═══════════════════════════════════════════════════════════════════
# MANAGER — the SUPERVISOR. It raises hard errors and repeated agent failures
# to the Queue Manager and alerts on contract violations. It does not chase a
# reviewer who has not answered, and it is not a router in the middle of the
# team.
# ═══════════════════════════════════════════════════════════════════
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true

  prompt: |
    This mesh resolves inbound customer-support tickets across every channel.
    A successful ticket flows: the Coordinator opens a case -> Intake triages
    (intent + priority; voice routed human/callback/self-serve) -> Sentiment
    scores frustration in parallel -> Response grounds an answer in the KB and
    drafts -> QA fact/tone/PII/policy-checks -> a human tier reviews -> the
    Dispatcher SENDS the approved reply on the arrival channel -> audit records
    it. The Coordinator keeps live status and is the single point of contact.

    Escalate to the Queue Manager (and page) when:
      - a ticket loops on QA rework past its bound (Response fails QA twice)
      - any ticket mentions cancel / refund / legal / regulator / breach / harm
      - Response's KB retrieval confidence < 0.7 — never let the bot guess
      - any agent hands off a malformed artifact

    Watch for: knowledge gaps (questions with no KB hit) — flag for a drafted
    article; a spiking ticket cluster — a possible regression worth triage;
    a tier-2 backlog building up. Silence never advances a ticket.

  routing:
    mode: "learning"
    memory_size: 300
    confidence_threshold: 0.7
    fallback: "all"
    decay_days: 30

  knowledge:
    serviceName: "mongo_main"
    enabled: true
    groupName: "support_runbook"

  escalation:
    targets:
      - type: "human_agent"
        agent: "queue_manager_human"
      # Webhook escalation (e.g. PagerDuty): create the vault connection
      # 'escalation_webhook' (an "Add custom" record on the Infrastructure
      # page, service type 'Outbound webhook'), then uncomment — here before the
      # first start, in Studio's YAML editor after it (applies live).
      # - type: "webhook"
        # connection: escalation_webhook   # vault connection holds the URL + headers
        # method: "POST"
        # payload_template:
          # incident_id: "{{ticket_id}}"
          # severity: "{{severity}}"
          # message: "{{message}}"
          # session_id: "{{session_id}}"
      # Slack: the channel id is set in .env (SLACK_SUPPORT_CHANNEL); posting
      # needs a Slack channel adapter — connect Slack on a human seat (channels:
      # {slack: {connection: <vault Slack record>}}, Infrastructure → Messaging →
      # Slack), then uncomment. Left live with no adapter it only logs an error.
      # - type: "channel"
        # provider: "slack"
        # channel_id: "${SLACK_SUPPORT_CHANNEL:}"
        # message_template: "[support] {{message}} — ticket {{ticket_id}} (session {{session_id}})"

    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3

  health_check_interval: 60
  agent_timeout_threshold: 300
  chain_completion_timeout: 600

# ═══════════════════════════════════════════════════════════════════
# DATA STRUCTURES
# ═══════════════════════════════════════════════════════════════════
data_structures:
  Ticket:
    type: "object"
    properties:
      ticket_id: { type: "string" }
      customer_id: { type: "string" }
      channel: { type: "string" }           # slack | email | chat | phone | web | discord | telegram | whatsapp
      channel_thread_id: { type: "string" } # for posting the reply back to the same thread
      received_at_utc: { type: "string" }
      raw_message: { type: "string" }
      attachments: { type: "list" }
      account_tier: { type: "string" }      # standard | named | enterprise
      raw_payload: { type: "object" }
    required: ["customer_id", "channel", "raw_message"]

  Triage:
    type: "object"
    properties:
      intent: { type: "string" }            # how_to | bug | billing | account | cancel | feature_request | other
      priority: { type: "string" }          # low | normal | high | urgent
      requires_specialist: { type: "boolean" }
      specialist_topic: { type: "string" }
      escalation_keywords: { type: "list" }
    required: ["intent", "priority"]

# ═══════════════════════════════════════════════════════════════════
# ENTRY POINTS — one per real-world trigger. Multiple entries; the pod is
# not forced through one intake.
# ═══════════════════════════════════════════════════════════════════
entry_points:
  # New inbound ticket — any channel opens a case with the Coordinator.
  - name: "slack_message"
    target: "case_coordinator_agent"
    description: "Slack DM or thread reply — the Coordinator opens the case."
  - name: "email_inbound"
    target: "case_coordinator_agent"
    description: "Email to support@company.com — the Coordinator opens the case."
  - name: "chat_widget"
    target: "case_coordinator_agent"
    description: "On-site chat widget message — the Coordinator opens the case."
  - name: "web_form"
    target: "case_coordinator_agent"
    description: "Web contact-form submission — the Coordinator opens the case."
  - name: "social_channel"
    target: "case_coordinator_agent"
    description: "Discord / Telegram / WhatsApp / Teams message — case opened."
  - name: "manual_ticket"
    target: "case_coordinator_agent"
    description: "Operator-created ticket (no inbound channel)."
  - name: "ticket_status"
    target: "case_coordinator_agent"
    description: "'Where is my ticket?' — the Coordinator answers from the case record."

  # Voice — the transcript goes straight to the triage owner (it owns voice routing).
  - name: "phone_transcribed"
    target: "ticket_intake_agent"
    description: "Voice call transcribed (Twilio, Vonage, etc.)."
  - name: "phone_call_intake"
    target: "ticket_intake_agent"
    description: "Voice-channel intake: classify intent, urgency, route human/callback/self-serve."

  # HITL resume — an operator answers / approves in the inbox.
  - name: "operator_reply"
    target: "tier_1_agent_human"
    description: "HITL resume — a Tier-1 operator reviews / approves a reply."

  # Follow-up drafting after a human-tier hand-off completes.
  - name: "callback_followup"
    target: "response_agent"
    description: "Human-tier hand-off complete — draft the follow-up."

  # Backlog drain — a scheduled/triggered sweep of the queued-ticket backlog.
  - name: "backlog_sweep"
    target: "backlog_triage_agent"
    description: "Drain the queued-ticket backlog — parallel copies each claim a disjoint batch."

  # Knowledge-debt signals — a resolved ticket with no KB hit, a repeated
  # question, or a run of failed searches drafts the missing article.
  - name: "kb_gap_signal"
    target: "kb_gap_filler_agent"
    description: "Ticket resolved that had no KB hit — draft the missing article."
  - name: "repeat_question_burst"
    target: "kb_gap_filler_agent"
    description: "Same question asked 3+ times in 24h — article missing or buried."
  - name: "failed_search_log"
    target: "kb_gap_filler_agent"
    description: "KB search returned nothing 5+ times — coverage-gap signal."

  # Support-desk analytics (read via n8n connector actors).
  - name: "post_resolution_csat"
    target: "support_insights_agent"
    description: "Forward one CSAT/NPS response to your support desk (csat_ingest)."
  - name: "csat_rollup"
    target: "support_insights_agent"
    description: "Read CSAT/NPS rollups + cluster trends (report mode)."
  - name: "ticket_pattern_scan"
    target: "support_insights_agent"
    description: "Scan recent tickets for trending + spiking clusters (report mode)."
  - name: "cross_channel_lookup"
    target: "cross_channel_agent"
    description: "Find this customer's threads across all channels — unify context."
  - name: "generate_crm_case"
    target: "crm_case_generator_agent"
    description: "At resolution — draft the structured CRM case for push."
  - name: "sla_scan"
    target: "sla_watchdog_agent"
    description: "Scan your support desk for tickets past SLA (n8n connector)."

  # Direct calls — every non-human agent is API-addressable for debugging /
  # programmatic ingest; bypasses the upstream chain.
  - name: "direct_call_triage"
    target: "ticket_intake_agent"
    description: "On-demand direct call to intake + triage + voice routing."
  - name: "direct_call_knowledge"
    target: "response_agent"
    description: "On-demand direct call to KB retrieval + response draft."
  - name: "direct_call_qa"
    target: "qa_agent"
    description: "On-demand direct call to the QA gate."

# ═══════════════════════════════════════════════════════════════════
# AGENTS
# ═══════════════════════════════════════════════════════════════════
agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Coordinator — Case Coordinator (AI). Owns the ticket end to end: opens the
  # case, records the arrival channel, hands it to Intake, keeps live status,
  # is the customer's one point of contact. Pure orchestration — never triages,
  # never drafts, never sends. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  case_coordinator_agent:
    name: "case_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 900
    description: "Case Coordinator — opens the case, orchestrates, keeps status, single point of contact."

    # Hear inbound messages live off the async stream, in addition to the
    # per-channel entry points. A channel-webhook receiver writes each message
    # onto support_events; the Coordinator wakes per event and opens a case.
    # listen_events:
      # - broker: "support_events"
        # stream: "support:inbound"
        # consumer_group: "support-coordinator"

    prompt: |
      You are the Case Coordinator. You OWN each support ticket from the moment
      it arrives to the moment the reply is sent. You orchestrate the pod and
      keep the customer informed — you never triage, draft, or send yourself.

      On a NEW inbound contact: open a case, mint or keep the ticket_id, record
      the arrival channel and time, set action "open_case", and hand it to
      Intake. On a STATUS ask ("where is my ticket?"): set action "status" and
      answer the current stage / waiting-on / next gate from the case record —
      invent nothing. Route a policy/exception to the Queue Manager
      (action "escalate"); route a security/legal/engineering matter to the SME
      (action "escalate_sme"). Never make the escalation call's substance
      yourself — you route it to the accountable human.

      Load the `status` playbook for exactly how to answer a status ask.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "ticket_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}

    yields:
      action: "string"          # open_case | status | escalate | escalate_sme
      ticket_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"

    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` loads when the model recognises the intent.
    playbook:
      - intent: status
        description: "How to answer a 'where is my ticket?' ask honestly."
        responsibility: |
          1. Read the case record for this ticket_id — current stage, who it is
             waiting on, and the next gate. Do NOT infer a stage you cannot see.
          2. If there is no case for this ticket_id, say so plainly and open one
             (action open_case) rather than guessing a stage.
          3. Report stage / waiting_on / next gate in one short, plain summary.
             Never promise a resolution time the record does not support.
        variables: [ticket_id]

    inputs:
      payload: "object"
      upstream_yields: "object"

    enforce_yields: true
    enforce_yields_retry: 2
    auto_store_response: true
    auto_store_yields: true

    can_call:
      # New contact -> triage owner opens the classification pass.
      - agent: "ticket_intake_agent"
        condition: "calling_agent_response.action == 'open_case'"
      # Policy / exception -> the accountable queue owner.
      - agent: "queue_manager_human"
        condition: "calling_agent_response.action == 'escalate'"
      # Security / legal / engineering -> Tier-3 SME.
      - agent: "sme_human"
        condition: "calling_agent_response.action == 'escalate_sme'"

  # ─────────────────────────────────────────────────────────────────────────
  # Intake — Triage Owner (AI). The single front door for classification:
  # normalises any channel payload into a canonical Ticket, classifies intent +
  # priority + specialist routing, scans hard-escalation keywords, AND owns the
  # voice channel (human / callback / self-serve). One role, three numbered
  # responsibilities. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  ticket_intake_agent:
    name: "ticket_intake_agent"
    agent_type: "llm"
    communication_type: "chain"          # AI specialist — chain, never dual
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1400
    description: "Triage owner for EVERY channel (voice included) — normalise into a canonical Ticket, classify intent + priority + specialist, route voice human/callback/self-serve."

    prompt: |
      You are the triage owner — the classification front door for every
      support channel, including voice. One role, three numbered
      responsibilities. Infer which apply from the input: a voice-call
      signature (transcript / call_id / customer_phone present) means
      responsibility 3 with intake_mode "voice_call"; everything else is
      responsibilities 1+2 in one pass with intake_mode "ticket".

      RESPONSIBILITY 1 — normalise this inbound contact into a canonical Ticket:
        - ticket_id: keep the upstream ticket_id when one is provided; otherwise
          mint "tkt-" followed by 12 random hex characters.
        - customer_id: from CRM lookup OR channel handle. NEVER invent a
          customer_id — leave empty if no match.
        - channel: slack | email | chat | phone | web | discord | telegram |
          whatsapp (lowercase; default "web" when not stated; always "phone" in
          voice mode).
        - channel_thread_id: so the reply posts back to the same thread.
        - raw_message: the customer message verbatim.
        - attachments: list of attachment refs.
        - account_tier: standard | named | enterprise (from CRM if available;
          default "standard" when unknown).
        - raw_payload: source payload verbatim for audit.

      RESPONSIBILITY 2 — classify the ticket you just normalised:
        - intent: EXACTLY one of how_to | bug | billing | account | cancel |
          feature_request | other. Anything outside this taxonomy maps to "other".
        - priority: EXACTLY one of low | normal | high | urgent (default "normal").
        - HARD-ESCALATION RULE (overrides your own judgment): if the message
          contains any of these words — legal, lawsuit, regulator, GDPR, CCPA,
          harm, injured, threatening, abuse, breach, leak, ransomware — copy
          every hit verbatim into escalation_keywords AND force priority to
          "urgent" unless it is already high or urgent. Also list cancel / refund
          verbatim in escalation_keywords when present (these do NOT force-bump
          priority on their own).
        - requires_specialist: true if intent is billing / account / cancel, OR
          account_tier is enterprise, OR the issue is security / legal in nature.
        - specialist_topic: the domain (billing, security, ...) when
          requires_specialist=true, else empty.
        - routing_briefing: ALWAYS 2-3 sentences for the agent picking this up —
          lead with intent + priority, then the escalation keywords found (or
          "no escalation keywords"), then whether it needs specialist review or
          is front-line resolvable, and the suggested first action.
        - escalation_reason: echo the upstream escalation_reason verbatim when
          provided; otherwise repeat routing_briefing.

      RESPONSIBILITY 3 — voice-call intake (only when the input is a voice call):
        - FAIL CLOSED on missing transcript: if the call has no transcript
          (failed STT), return intent "unknown_no_transcript", priority "urgent",
          urgency 0.8, disposition "human", requires_human_now true and
          spoken_reply "Let me connect you with a specialist."
        - intent: short snake_case (order_status, billing_query, ...).
        - urgency: 0..1 — NEVER above 1 (no 0-10 scales). Score at least 0.7 when
          the transcript contains urgency keywords as WHOLE WORDS — emergency,
          urgent, now, immediately, down, outage, broken, can't access, locked
          out, fraud, stolen, lost, danger, lawsuit, lawyer, press, ceo — or
          shouting (3+ ALL-CAPS words, or 2+ exclamation marks). Whole words
          only: "now" inside "know" does not count. Anchors: 0.8 = high,
          0.5 = mid, 0.2 = low.
        - disposition, decided in this order:
            1. urgency >= 0.7 -> "human", spoken_reply "Let me get a specialist
               on the line right now. One moment."
            2. intent is one of order_status, tracking, store_hours,
               return_policy, password_reset, billing_history AND urgency < 0.4
               AND you can answer in 1-2 sentences -> "self_serve" with that
               answer as spoken_reply. If you cannot answer it -> "human" with
               "Let me connect you with a specialist."
            3. everything else -> "callback", spoken_reply "Thanks for reaching
               out. We have you in the queue. A specialist will call you back at
               <customer_phone, or 'your number'> within 15 minutes. Reference
               number is <call_id>."
        - the HARD-ESCALATION RULE applies to transcripts too.
        - raw_message: the transcript verbatim.
        - transcript_chars: length of the transcript in characters.
        - requires_human_now: true exactly when disposition is "human".
        - requires_callback: true exactly when disposition is "callback".
        - handled_at_utc: current UTC time, ISO-8601.
        - routing_briefing AND escalation_reason: "voice call — <intent> intent,
          urgency <n>, disposition <d>" plus any escalation keywords found.

      Voice-mode keys are vacuous in ticket mode (empty / 0 / false) and the
      ticket-route edges are gated on intake_mode, so the two modes never
      cross-fire. Return JSON with ALL keys on every path.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"intake_mode": "", "ticket_id": "", "customer_id": "", "channel": "", "channel_thread_id": "", "raw_message": "", "attachments": [], "account_tier": "", "raw_payload": {}, "intent": "", "priority": "", "requires_specialist": false, "specialist_topic": "", "escalation_keywords": [], "routing_briefing": "", "escalation_reason": "", "call_id": "", "customer_phone": "", "urgency": 0, "disposition": "", "spoken_reply": "", "transcript_chars": 0, "requires_human_now": false, "requires_callback": false, "handled_at_utc": ""}

    enforce_yields: true
    enforce_yields_retry: 3

    # Classification taxonomy group (the role's core skill).
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "intent_taxonomy"

    yields:
      # Mode marker — 'ticket' | 'voice_call' (keeps modes from cross-firing)
      intake_mode: "string"
      # Responsibility 1 — canonical Ticket
      ticket_id: "string"
      customer_id: "string"
      channel: "string"
      channel_thread_id: "string"
      raw_message: "string"
      attachments: {type: array, items: string}   # attachment refs
      account_tier: "string"
      raw_payload: "object"
      # Responsibility 2 — triage classification
      intent: "string"
      priority: "string"
      requires_specialist: "boolean"
      specialist_topic: "string"
      escalation_keywords: {type: array, items: string}
      routing_briefing: "string"
      escalation_reason: "string"
      # Responsibility 3 — voice-call routing (vacuous in ticket mode)
      call_id: "string"
      customer_phone: "string"
      urgency: "number"
      disposition: "string"             # self_serve | human | callback
      spoken_reply: "string"
      transcript_chars: "number"
      requires_human_now: "boolean"
      requires_callback: "boolean"
      handled_at_utc: "string"

    inputs:
      payload: "object"
      upstream_yields: "object"
      transcript: "string"
      call_id: "string"
      customer_phone: "string"

    context_parts:
      guardrails: |
        Never quote customer message contents in logs (privacy). Use the
        canonical ticket_id as the operator-visible identifier.

    narration: |
      If escalation_keywords contains legal / regulator / breach / GDPR / harm,
      the legal/regulatory surface is a human gate with no exceptions — voice
      transcripts included. A customer who sounds furious or threatens to leave
      but trips no hard keyword still deserves the escalation path — consider
      queue_manager_human alongside the normal route.

    auto_store_response: true
    auto_store_yields: true

    can_call:
      # Sentiment fires in parallel from the same event.
      - agent: "sentiment_agent"
        condition: "true"

      # Ticket mode, HARD-ESCALATION GATE: any escalation keyword (legal / breach
      # / GDPR / harm / ...) goes straight to a human — never the bot — whatever
      # the intent. Mutually exclusive with the response edge below.
      - agent: "queue_manager_human"
        condition: "calling_agent_response.intake_mode == 'ticket' and calling_agent_response.intent != 'cancel' and calling_agent_response.escalation_keywords != []"

      # Ticket mode: non-cancel, no escalation keyword -> KB-grounded draft.
      - agent: "response_agent"
        condition: "calling_agent_response.intake_mode == 'ticket' and calling_agent_response.intent != 'cancel' and calling_agent_response.escalation_keywords == []"

      # Ticket mode: cancel intent -> queue manager directly (retention path).
      - agent: "queue_manager_human"
        condition: "calling_agent_response.intake_mode == 'ticket' and calling_agent_response.intent == 'cancel'"

      # Voice mode: high urgency / IVR escape -> human now.
      - agent: "tier_1_agent_human"
        condition: "calling_agent_response.requires_human_now == true"

      # Voice mode: capacity exceeded -> callback booked, human follows up.
      - agent: "tier_1_agent_human"
        condition: "calling_agent_response.requires_callback == true"

      # Voice mode: self-serve -> confirm-and-log via response_agent.
      - agent: "response_agent"
        condition: "calling_agent_response.disposition == 'self_serve'"

  # ─────────────────────────────────────────────────────────────────────────
  # Sentiment — Customer-Sentiment Analyst (AI). Scores frustration / urgency /
  # churn in parallel; a co-input to Response, not a sequential gate. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  sentiment_agent:
    name: "sentiment_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 400
    description: "Scores urgency / frustration / churn risk; cites the phrases that drove each score."

    prompt: |
      Score the customer message:
        - frustration: 0..1
        - urgency: 0..1
        - polite: boolean — is the customer courteous?
        - churn_risk: 0..1 (mentions of cancel, frustration, "last time")

      Every numeric score MUST stay within 0 and 1 — never a 0-10 scale. In
      cited_phrases, quote the verbatim phrases that drove each score.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"frustration": 0, "urgency": 0, "polite": false, "churn_risk": 0, "cited_phrases": []}

    enforce_yields: true
    enforce_yields_retry: 1

    yields:
      frustration: "number"
      urgency: "number"
      polite: "boolean"
      churn_risk: "number"
      cited_phrases: {type: array, items: string}

    inputs:
      upstream_yields: "object"

    # Co-input to response, not a router.
    can_call: []

  # ─────────────────────────────────────────────────────────────────────────
  # Response — Knowledge Specialist (AI, Super-Agent). Retrieves the grounded
  # answer AND drafts the customer reply in one pass. This is where deflection
  # is won honestly: no cited source => confidence capped => escalate, never a
  # guess. super_agent = autonomous plan/retrieve/verify/synthesise over the KB
  # + past tickets. playbook = per-intent craft; skills = house tone (resident).
  # Day-0 KB reads come from the seed store tools (agency/tools.py); wire real
  # RAG / a docs MCP later.
  # ─────────────────────────────────────────────────────────────────────────
  response_agent:
    name: "response_agent"
    agent_type: "llm"
    communication_type: "chain"          # AI specialist — chain, never dual
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_tokens: 1800
    max_tool_calls_per_message: 12       # KB search + past-ticket reads; default 5 truncates silently
    description: "Knowledge specialist — retrieves the grounded KB answer and drafts the tone-aware reply."

    # Fan-in — wait for triage (intent + priority); sentiment is optional context.
    wait_for: "ticket_intake_agent AND sentiment_agent?"
    wait_for_timeout: 60

    super_agent:                         # DICT form = the tuning path (2.4.123+); the ONLY way to tune it
      cost_ceiling: 100000               # aggregate token budget for one grounded-answer run
      wall_clock: 900                    # per-run wall-clock seconds

    prompt: |
      Two stages, one pass.

      STAGE 1 — retrieval: find the right answer for this ticket from the
      knowledge base (docs, runbook, prior solved tickets) using your tools.
      Cite each source. If you cannot find a confident answer (confidence < 0.7),
      say so explicitly — do NOT make something up. Downstream escalates to a
      Tier-2 specialist.

      STAGE 2 — draft the customer reply, grounded ONLY in what stage 1 retrieved.

      Field rules (all keys required):
        - answer_outline: the grounded answer skeleton.
        - cited_sources: source IDs / URLs the reply cites.
        - confidence: 0..1 retrieval confidence — never above 1. NO-SOURCE-NO-
          ANSWER FLOOR: if cited_sources is empty, confidence MUST NOT exceed 0.4.
        - knowledge_gap: true whenever no good source was found OR confidence < 0.5.
        - reply_body: the draft customer-facing reply (3-5 short paragraphs).
        - tone_used: EXACTLY one of empathetic | concise | technical | warm
          (default "warm").
        - suggested_followup: the next step if the customer needs more help.
        - ticket_id: echo the upstream ticket_id verbatim.
        - revision_round: echo the upstream revision_round if QA sent this back
          for rework (start 0; QA increments the bound).

      Adapt tone to sentiment: frustration >= 0.6 -> start with empathy;
      polite=true -> match the customer's tone; urgency >= 0.7 -> lead with the
      answer, then the explanation. Never promise a roadmap commitment or a
      discount. Load the `refund` playbook on a refund ask and the `escalation`
      playbook when the answer is out of front-line scope.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"answer_outline": "", "cited_sources": [], "confidence": 0, "knowledge_gap": false, "reply_body": "", "tone_used": "", "suggested_followup": "", "ticket_id": "", "revision_round": 0}

    enforce_yields: true
    enforce_yields_retry: 2

    # Day-0 KB tool surface — reads the seed KB / past-ticket store so the pod
    # runs with NO RAG wired. Each tool announces itself (available:false) when
    # it has no real source. See agency/tools.py.
    tools: ["search_kb", "read_past_tickets"]

    # Playbook — per-intent craft, fetched on demand (description in the prompt;
    # responsibility loaded when the model recognises the intent).
    playbook:
      - intent: refund
        description: "How to handle a refund request without over-promising."
        responsibility: |
          1. Retrieve the refund policy from the KB FIRST — never quote a refund
             window or eligibility you have not cited.
          2. If the request is inside policy, state the exact steps and the
             expected timeline the policy gives. If outside policy or ambiguous,
             do NOT approve it in the reply — set knowledge_gap and let it route
             to a specialist.
          3. Never offer a discount, credit, or goodwill amount on your own
             authority — that is a human decision.
        variables: [ticket_id]
      - intent: escalation
        description: "How to hand a ticket up cleanly when it is out of scope."
        responsibility: |
          1. State plainly what you could and could not resolve, with the sources
             you did find, so the specialist does not restart from zero.
          2. Set confidence honestly (below 0.7 routes to Tier-2). Do not pad the
             answer to clear the QA gate.
          3. Keep the customer-facing reply reassuring but non-committal about the
             outcome the specialist will decide.
        variables: [ticket_id]

    # Skills — reusable playbooks loaded on demand; `eager` ships the always-
    # relevant house tone resident in the prompt (register the source via the
    # Skills API — see agent-config-fields.md).
    skills:
      sourceName: "default"
      enabled: true
      names: ["tone", "refund_reply"]
      eager: ["tone"]

    yields:
      answer_outline: "string"
      cited_sources: {type: array, items: string}   # source ids / URLs
      confidence: "number"              # 0..1 retrieval confidence
      knowledge_gap: "boolean"          # true if no good source found
      reply_body: "string"
      tone_used: "string"               # empathetic | concise | technical | warm
      suggested_followup: "string"
      ticket_id: "string"               # identity passthrough — Tier-2 sees WHICH ticket
      revision_round: "number"          # QA-rework counter (bounded back-edge)

    inputs:
      upstream_yields: "object"

    context_parts:
      guardrails: |
        Never invent product features or commitments. If the customer asks about
        a feature not in the KB, route to feature_request intent — don't promise.

    # ── To wire a real docs/KB MCP server: create the vault connection
    #    'docs_mcp' (the server's URL + token — Infrastructure → Integrations →
    #    MCP, or an "Add custom" record with service type Tools), then uncomment
    #    (here before the first start, in Studio's YAML editor after it)
    #    (each named action under `use:` joins this agent's tool list,
    #    namespaced <server>_<tool>). A URL or token written here is refused at
    #    load. The day-0 search_kb / read_past_tickets dev tools are the
    #    fallback contract. ──
    # mcp:
    #   - connection: docs_mcp
    #     transport: http
    #     use: [search_docs, fetch_article]
    #     name: docs
    #     timeout: 30

    can_call:
      # Confident, grounded draft -> QA gate.
      - agent: "qa_agent"
        condition: "calling_agent_response.confidence >= 0.7 and calling_agent_response.knowledge_gap == false"
      # Low retrieval confidence -> Tier-2 specialist takes it.
      - agent: "tier_2_specialist_human"
        condition: "calling_agent_response.confidence < 0.7"

    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # QA — Quality & Compliance Reviewer (AI). Tone / accuracy / policy / PII gate
  # before the customer sees the reply. Bounded QA-rework back-edge to Response
  # (exhaustion counter -> terminal route to the Queue Manager). (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  qa_agent:
    name: "qa_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 800
    description: "Tone / accuracy / policy / PII gate before the customer sees the reply."

    prompt: |
      QA the draft reply:
        - Accuracy: does the reply match the KB sources response_agent cited?
        - Tone: appropriate for the sentiment scored? Set tone_acceptable.
        - PII SWEEP (be exhaustive — humans miss things, you must not): scan the
          reply body for ANY email address (record "email:<address>") and ANY
          account / customer identifier — "account id: ABC123", "acc-num 4452-...",
          "customer number: X9-..." (record "account_id:<value>"). Flag
          third-party personal names. Every hit goes in pii_concerns, deduped.
        - POLICY SWEEP: if the reply body contains any of these phrases —
          discount, refund, free upgrade, roadmap commit, guarantee — record each
          as "policy_word:<word>" in policy_concerns. Promises beyond what is
          authorised are policy concerns too.
        - Length: under 5 short paragraphs?

      CARDINAL RULE: if pii_concerns or policy_concerns is non-empty, approved
      MUST be false — no exceptions — and issues must note the counts (e.g.
      "pii_detected:2"). approved=true only if ALL checks pass. Otherwise list
      specific issues so response_agent can rewrite.

      Echo upstream values verbatim: ticket_id and reply_body (the exact draft
      you reviewed). revision_round: echo the upstream revision_round, then ADD 1
      whenever you return the draft for rework (approved=false) — this bounds the
      rework loop.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"approved": false, "issues": [], "tone_acceptable": false, "pii_concerns": [], "policy_concerns": [], "ticket_id": "", "reply_body": "", "revision_round": 0}

    enforce_yields: true
    enforce_yields_retry: 2

    yields:
      approved: "boolean"
      issues: {type: array, items: string}
      tone_acceptable: "boolean"
      pii_concerns: {type: array, items: string}      # "email:<addr>", "account_id:<v>"
      policy_concerns: {type: array, items: string}   # "policy_word:<word>"
      ticket_id: "string"               # identity passthrough — Tier-1 reviews THIS ticket
      reply_body: "string"
      revision_round: "number"          # bounded back-edge counter

    inputs:
      upstream_yields: "object"

    narration: |
      pii_concerns or policy_concerns being non-empty ALWAYS routes to a human
      review — never auto-send a reply with PII or out-of-policy promises.

    can_call:
      # Clean reply -> Tier-1 reviews and sends (HITL gate before the customer).
      - agent: "tier_1_agent_human"
        condition: "calling_agent_response.approved == true and calling_agent_response.pii_concerns == []"
      # Failed QA, within the bound -> back to Response for rework (bounded).
      - agent: "response_agent"
        condition: "calling_agent_response.approved == false and calling_agent_response.revision_round < 2"
      # Rework bound exhausted -> terminal route to the Queue Manager.
      - agent: "queue_manager_human"
        condition: "calling_agent_response.approved == false and calling_agent_response.revision_round >= 2"

    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Backlog Triage — Bulk Triage Drainer (AI, N parallel copies). Drains the
  # queued-ticket backlog: each of the scaling.copies.count copies atomically CLAIMS a
  # disjoint batch (claim_ticket_batch) so copies never duplicate work, triages
  # them, and hands escalation-worthy tickets to the Queue Manager. Distinct
  # from real-time Intake (which is the per-ticket front door). Scheduled sweep
  # runs in the business timezone, NOT UTC.
  # ─────────────────────────────────────────────────────────────────────────
  backlog_triage_agent:
    name: "backlog_triage_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1200
    max_tool_calls_per_message: 10
    description: "Bulk triage drainer — parallel copies each claim a disjoint backlog batch and triage it."

    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3                          # 3 parallel copies per activation
        handoff: last               # COMBINE: counts sum, lists concat, route once

    # Scheduled sweep — daily at 08:00 in the business timezone (NOT UTC). Also
    # reachable via the backlog_sweep entry point. One cron line is all a fanned
    # agent needs (a multi-entry wake_up would multiply by copies.count).
    wake_up: "0 8 * * *"
    timezone: "America/New_York"
    wake_up_input:
      trigger: backlog_sweep

    prompt: |
      You are draining the queued-ticket backlog. Call claim_ticket_batch to
      atomically claim YOUR batch of backlog tickets — the claim guarantees your
      copy and the other copies get DISJOINT tickets, so you never duplicate work.
      The claim returns each ticket's content (`tickets`: channel, customer,
      subject, message). Triage each claimed ticket exactly as the front door
      would: intent, priority, and whether it needs escalation (the same
      hard-escalation words: legal, GDPR, breach, regulator, harm, …; and an
      outage or a cancel). A ticket with no message text is escalated, not
      guessed at. Collect the ticket_ids you escalate. Report honest counts —
      do not invent tickets you did not claim.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"claimed_ticket_ids": [], "triaged_count": 0, "escalations": [], "backlog_remaining": 0, "summary": ""}

    enforce_yields: true
    enforce_yields_retry: 1

    tools: ["claim_ticket_batch"]

    yields:
      claimed_ticket_ids: {type: array, items: string}
      triaged_count: "number"
      escalations: {type: array, items: string}       # ticket_ids escalated
      backlog_remaining: "number"
      summary: "string"

    inputs:
      trigger: "string"
      upstream_yields: "object"

    can_call:
      # Escalation-worthy tickets in the batch -> the queue owner.
      - agent: "queue_manager_human"
        condition: "calling_agent_response.escalations != []"
      # Record the drain (count, remaining) to the WORM sink — terminus.
      - agent: "support_audit_logger_agent"
        condition: "calling_agent_response.triaged_count >= 0"

    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Reply Dispatcher — the EGRESS ACTUATOR / FINISHER (programmatic). The team
  # drafts (Response), clears (QA) and a human APPROVES (Tier-1) a reply — but
  # approval is NOT delivery. This role FINISHES the job: it re-checks approval
  # (allow-token allowlist + block-token denylist, UNKNOWN fails closed),
  # enforces deterministic invariants a human can't waive (PII/policy empty,
  # a real reply body), renders the sent reply to ./out, DELETES the artifact on
  # a tripped floor, records the send to the dev outbox (announcing itself), and
  # routes every send AND every block to audit. See agency/reply_dispatcher_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  reply_dispatcher_agent:
    name: "reply_dispatcher_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Egress actuator / finisher — SENDS the approved reply on its arrival channel (in-thread, batched when async), renders the artifact, fail-closed on unapproved / PII."
    # The comms platform that SENDS the approved reply (Slack postMessage /
    # email gateway / CPaaS) behind an n8n workflow. Day 0 it is not wired:
    # the Python records each approved send in the dev outbox and renders it.
    # The connector lines ship commented on purpose: an n8n agent with no
    # workflow address fails every call, and after 5 failures in a row the
    # SDK quarantines it (its Python stops running until someone releases it).
    # To wire it: create the vault connection 'comms_dispatch_n8n'
    # (Infrastructure → Integrations → n8n, or an "Add custom" record with
    # service type Tools: base URL = the workflow's webhook URL, secret = its
    # auth token), then uncomment the three lines below (in configs/config.yaml
    # before the first start, in Studio's YAML editor after it). Your workflow
    # receives the approved reply in `reply_body`, or the person's corrected
    # text (`edited_reply`, in the reply's human_data) when the decision is
    # edit_and_send — send that one.
    # The n8n call runs before this agent's Python floor, so the workflow must
    # send only when `human_message` is an approval word.
    # integration: "n8n"
    # connector_config:
    #   connection: comms_dispatch_n8n

    yields:
      dispatch_id: "string"
      ticket_id: "string"
      channel: "string"
      channel_thread_id: "string"
      delivery_mode: "string"           # in_thread | batched | blocked
      sent: "boolean"
      send_status: "string"             # recorded | connector_sent | blocked
      dispatched_at_utc: "string"
      dispatch_reason: "string"
      artifact_path: "string"
      block_reasons: "list"

    inputs:
      upstream_yields: "object"
      ticket_id: "string"
      channel: "string"
      channel_thread_id: "string"
      reply_body: "string"

    can_call:
      # Sent (or recorded-sent) OR fail-closed block -> audit terminus. The WORM
      # log records every send AND every blocked dispatch.
      - agent: "support_audit_logger_agent"

    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, reached in the inbox they already live in.
  # Nothing is sent on silence: on leafmesh 2.4.486 a review nobody answers in
  # time closes its Inbox card and the ticket records that no reply came. Each
  # seat still declares fallback_response: held_for_review (-> audit) as the
  # intended timeout answer. `dual` belongs on the human boundary agents; they
  # only ever call chain agents (never another dual human), so there is no
  # dual->dual ping-pong. Which tier a ticket reaches is decided by the routing
  # (confidence, keywords, intent) — nobody is chased automatically.
  # ─────────────────────────────────────────────────────────────────────────
  tier_1_agent_human:
    name: "tier_1_agent_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 1800          # 30 min — tickets shouldn't stall
    description: "Tier-1 support agent — reviews and sends the reply."
    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes to the
    #   SHARED inbox. Only set real operator emails: a placeholder assigns tasks
    #   to a nonexistent operator and they never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review

    yields:
      decision: "string"                # approve | edit_and_send | hold
      edited_reply: "string"            # with edit_and_send: the full text to send instead
      sent_at_utc: "string"

    inputs:
      ticket_id: "string"
      reply_body: "string"
      channel: "string"
      channel_thread_id: "string"

    human_prompt_template: |
      QA-cleared reply for this ticket. Read it against the customer's message.
      Reply 'approve' (or 'send') to SEND it on the channel it arrived on,
      'edit_and_send' with your corrected text in edited_reply, or 'hold' to
      keep it back. Any other reply is recorded and nothing is sent.
      If nobody answers within 30 minutes, the request waits no longer: its
      Inbox card closes and the ticket records that no reply came. Nothing is
      sent on silence.

    can_call:
      # APPROVED -> the finisher that actually sends. Approval is not delivery:
      # Tier-1 signs off, reply_dispatcher_agent FINISHES the job. Its fail-closed
      # floor re-checks approval + PII before it sends. The tokens match the
      # dispatcher's allow-list exactly.
      - agent: "reply_dispatcher_agent"
        condition: "calling_agent_response.human_message == 'sent' or calling_agent_response.human_message == 'send' or calling_agent_response.human_message == 'edit_and_send' or calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'approved'"
      # Hold / held_for_review / any other reply -> audit (recorded, not sent).
      - agent: "support_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'sent' and calling_agent_response.human_message != 'send' and calling_agent_response.human_message != 'edit_and_send' and calling_agent_response.human_message != 'approve' and calling_agent_response.human_message != 'approved'"

  tier_2_specialist_human:
    name: "tier_2_specialist_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 7200
    description: "Tier-2 specialist — billing / security / account depth."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review

    yields:
      decision: "string"
      edited_reply: "string"            # with edit_and_send: the full text to send instead
      notes: "string"

    inputs:
      ticket_id: "string"
      reply_body: "string"

    human_prompt_template: |
      The knowledge base had no confident answer for this ticket (confidence
      below 0.7). Write or fix the reply: answer 'edit_and_send' with your text
      in edited_reply, or 'approve' to SEND the draft as it is, or 'hold' to keep it back. Any other reply is
      recorded and nothing is sent. Engineering, security or legal matters
      belong with the SME: say so in your hold note.
      If nobody answers within 2 hours, the request waits no longer: its Inbox
      card closes and the ticket records that no reply came.

    can_call:
      # A specialist-resolved reply can also go to the finisher to send.
      - agent: "reply_dispatcher_agent"
        condition: "calling_agent_response.human_message == 'sent' or calling_agent_response.human_message == 'send' or calling_agent_response.human_message == 'edit_and_send' or calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'approved'"
      # Hold / any other reply -> audit (recorded, not sent).
      - agent: "support_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'sent' and calling_agent_response.human_message != 'send' and calling_agent_response.human_message != 'edit_and_send' and calling_agent_response.human_message != 'approve' and calling_agent_response.human_message != 'approved'"

  sme_human:
    name: "sme_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400
    description: "Tier-3 SME — engineering / security / legal escalation."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review

    yields:
      decision: "string"
      notes: "string"

    inputs:
      ticket_id: "string"
      specialist_topic: "string"

    human_prompt_template: |
      Engineering / security / legal matter routed to you. Record your decision
      and notes. Every reply is recorded to the audit log; nothing is sent to
      the customer from here.
      If nobody answers within 4 hours, the request waits no longer: its Inbox
      card closes and the ticket records that no reply came.

    can_call:
      # Terminus — every SME decision (and a held gate) is recorded.
      - agent: "support_audit_logger_agent"

  queue_manager_human:
    name: "queue_manager_human"
    agent_type: "human"
    is_human_powered: true
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 3600
    description: "Queue manager — owns escalations, cancel-intent, SLA breaches, the legal/breach gate."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review

    yields:
      decision: "string"
      directive: "string"

    inputs:
      ticket_id: "string"
      escalation_reason: "string"

    human_prompt_template: |
      Escalated ticket (hard-escalation keyword, cancel intent, QA rework limit,
      thread merge, or a drafted KB article for review). Record your decision
      and directive. Every reply is recorded to the audit log; nothing is sent
      to the customer from here.
      If nobody answers within 1 hour, the request waits no longer: its Inbox
      card closes and the ticket records that no reply came.

    can_call:
      # Terminus — every escalation decision (and a held gate) is recorded.
      - agent: "support_audit_logger_agent"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("support_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  support_audit_logger_agent:
    name: "support_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "WORM audit — hash-chains every reply sent, escalation, and held gate. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/support_audit.jsonl"

    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"

    inputs:
      session_id: "string"
      payload: "object"

    can_call: []

  # ─────────────────────────────────────────────────────────────────────────
  # kb_gap_filler_agent — Knowledge-base author (AI). When a resolved ticket had
  # no KB hit, drafts the article that should have existed (HITL reviewed).
  # ─────────────────────────────────────────────────────────────────────────
  kb_gap_filler_agent:
    name: "kb_gap_filler_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 1200
    description: "When the KB had no answer, drafts the article from the resolution path (HITL reviewed)."

    prompt: |
      A support ticket got resolved AND response_agent's KB retrieval had
      returned knowledge_gap=true — we didn't have an article for this. Draft
      the article we should have had:
        - article_title: short, search-friendly.
        - problem_statement: the customer pain in their words.
        - resolution_steps: numbered list (specific, copy-pasteable).
        - prerequisites: anything the customer needs first.
        - related_articles: slugs that link nearby.
        - suggested_kb_section: which KB section this goes under.
        - confidence: 0..1 in completeness — never above 1. QUALITY FLOOR: an
          article with zero resolution_steps is not useful — if resolution_steps
          is empty, confidence MUST NOT exceed 0.4.

      Write for the next customer who'll search this. Not for an internal engineer.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"article_title": "", "problem_statement": "", "resolution_steps": [], "prerequisites": [], "related_articles": [], "suggested_kb_section": "", "confidence": 0}

    enforce_yields: true
    enforce_yields_retry: 1

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "kb_style_guide"

    yields:
      article_title: "string"
      problem_statement: "string"
      resolution_steps: {type: array, items: string}
      prerequisites: {type: array, items: string}
      related_articles: {type: array, items: string}
      suggested_kb_section: "string"
      confidence: "number"

    inputs:
      resolved_ticket: "object"

    can_call:
      # KB editor / queue manager reviews the draft before publishing.
      - agent: "queue_manager_human"

  # ─────────────────────────────────────────────────────────────────────────
  # crm_case_generator_agent — Case documenter (AI). At resolution, drafts the
  # categorised, push-ready CRM case; feeds the insights rollup.
  # ─────────────────────────────────────────────────────────────────────────
  crm_case_generator_agent:
    name: "crm_case_generator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-haiku-4-5-20251001"
    temperature: 0.0
    max_completion_tokens: 1500
    description: "At ticket resolution — drafts the categorised CRM case for push to Salesforce / HubSpot / Zendesk."

    prompt: |
      Generate the CRM case record from the resolved ticket.

      CATEGORY TAXONOMY (category -> allowed subcategories):
        billing: payment_failed, refund, subscription_change, invoice_dispute, tax_query
        technical: bug_report, feature_request, performance, integration_issue, data_loss
        account: password_reset, access_revoked, user_provisioning, permission_change, sso_setup
        product: how_to, feature_walkthrough, use_case, best_practice, migration_guidance
        service: sla_breach, outage_followup, downgrade, cancellation
      Normalisation: category MUST be one of the five; subcategory MUST belong to
      it. If your subcategory is not in the chosen category's list, use the FIRST
      subcategory of that category. If only the subcategory is recognisable,
      infer its category. Ultimate fallback: category "product", subcategory "how_to".

      Field rules:
        - case_id: "case-<ticket_id>-<unix epoch seconds>". If there is NO
          upstream ticket_id, leave case_id and ticket_id empty and set
          ready_for_crm_push false.
        - ticket_id / customer_key / csat_score: echo upstream verbatim (csat_score
          0 when absent).
        - product_feature: which product area the case was about.
        - sentiment_trajectory: from upstream sentiment across the ticket —
          "improved" / "degraded" / "consistently_positive" /
          "consistently_negative" / "neutral"; "unknown" when no data.
        - kb_articles_cited: KB article IDs referenced.
        - resolution_summary: 2-4 sentences. What was wrong, what we did, what
          avoids recurrence.
        - time_to_resolve_minutes: from upstream timestamps (0 when unknown; never
          negative).
        - generated_at_utc: current UTC time, ISO-8601.
        - ready_for_crm_push: true ONLY when resolution_summary, category and
          subcategory are all non-empty.

      Be specific. "Resolved per workflow" is useless to the next person who
      searches this case. Cite the exact KB step that worked.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"case_id": "", "ticket_id": "", "customer_key": "", "category": "", "subcategory": "", "product_feature": "", "sentiment_trajectory": "", "kb_articles_cited": [], "resolution_summary": "", "time_to_resolve_minutes": 0, "csat_score": 0, "generated_at_utc": "", "ready_for_crm_push": false}

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "crm_taxonomy"

    yields:
      case_id: "string"
      ticket_id: "string"
      customer_key: "string"
      category: "string"
      subcategory: "string"
      product_feature: "string"
      sentiment_trajectory: "string"
      kb_articles_cited: {type: array, items: string}
      resolution_summary: "string"
      time_to_resolve_minutes: "number"
      csat_score: "number"
      generated_at_utc: "string"
      ready_for_crm_push: "boolean"

    inputs:
      upstream_yields: "object"
      ticket_id: "string"
      customer_key: "string"

    can_call:
      # On a push-ready resolution, pull the insights rollup (CSAT + clusters).
      - agent: "support_insights_agent"
        condition: "calling_agent_response.ready_for_crm_push == true"

    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Connector actors — systems reached as boundary agents, NOT mesh members.
  # CSAT / SLA / cross-channel identity live in YOUR support desk + CRM (Zendesk
  # Explore, Zendesk SLA policies, Salesforce/Segment) behind n8n workflows that
  # return each agent's yields shape. Inert until its vault connection is wired.
  # ─────────────────────────────────────────────────────────────────────────
  support_insights_agent:
    name: "support_insights_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "Support insights analyst — CSAT/NPS rollups AND trending/spiking clusters, read via n8n. Modes: csat_ingest | cluster_ingest | report."
    # CSAT/NPS rollups + cluster trends from your support desk's analytics. Day 0 the record does not exist yet. To wire it: create the vault
    # connection 'support_insights_n8n' (Infrastructure → Integrations → n8n, or an "Add custom"
    # record with service type Tools: base URL = the workflow's webhook
    # URL, secret = its auth token), until it exists the SDK switches this
    # agent off with a notice (it is never called without an address); it
    # switches on, with no restart, once the record exists. A
    # webhook URL or token written here is refused at load.
    connector_config:
      connection: support_insights_n8n
    yields:
      mode: "string"
      customer_id: "string"
      customer_recent_band: "string"
      customer_avg_score: "number"
      rolling_30d: "object"
      rolling_90d: "object"
      csat_briefing: "string"
      total_24h: "number"
      total_7d: "number"
      trending_clusters: "list"
      spike_count: "number"
      spike_clusters: "list"
      clustering_briefing: "string"
    inputs:
      mode: "string"
      ticket_id: "string"
      customer_id: "string"
      survey_kind: "string"
      score: "number"
      comment: "string"
      channel: "string"
      intent: "string"
      product_area: "string"
      error_code: "string"
      raw_summary: "string"
      raw_message: "string"
    can_call:
      # A spiking cluster likely needs a new article AND signals a possible regression.
      - agent: "kb_gap_filler_agent"
        condition: "calling_agent_response.spike_count > 0"
    auto_store_response: true
    auto_store_yields: true

  cross_channel_agent:
    name: "cross_channel_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "Unifies customer threads across email, Slack, Zendesk, WhatsApp — identity resolved in your CRM (Salesforce / Segment) via n8n."
    # Cross-channel identity resolution in your CRM. Day 0 the record does not exist yet. To wire it: create the vault
    # connection 'cross_channel_n8n' (Infrastructure → Integrations → n8n, or an "Add custom"
    # record with service type Tools: base URL = the workflow's webhook
    # URL, secret = its auth token), until it exists the SDK switches this
    # agent off with a notice (it is never called without an address); it
    # switches on, with no restart, once the record exists. A
    # webhook URL or token written here is refused at load.
    connector_config:
      connection: cross_channel_n8n
    yields:
      customer_key: "string"
      current_channel: "string"
      linked_threads: "list"
      linked_count: "number"
      channels_seen: "list"
      has_open_elsewhere: "boolean"
      history_summary: "string"
      requires_thread_merge: "boolean"
    inputs:
      upstream_yields: "object"
      customer_email: "string"
      customer_phone: "string"
      customer_id: "string"
      ticket_id: "string"
      channel: "string"
    can_call:
      # Unified context, nothing to merge -> continue to Response.
      - agent: "response_agent"
        condition: "calling_agent_response.requires_thread_merge == false"
      # An open thread elsewhere -> a senior agent merges first.
      - agent: "queue_manager_human"
        condition: "calling_agent_response.requires_thread_merge == true"
    auto_store_response: true
    auto_store_yields: true

  sla_watchdog_agent:
    name: "sla_watchdog_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "Scans your support desk (Zendesk SLA policies via n8n) for tickets past SLA and reports breaches."
    # wake_up: "*/5 * * * *"   # enable AFTER wiring the Zendesk-SLA n8n connector.
    # timezone: "America/New_York"   # governs the cron above once enabled (crons run UTC otherwise).
    # SLA breach state from your support desk. Day 0 the record does not exist yet. To wire it: create the vault
    # connection 'sla_watchdog_n8n' (Infrastructure → Integrations → n8n, or an "Add custom"
    # record with service type Tools: base URL = the workflow's webhook
    # URL, secret = its auth token), until it exists the SDK switches this
    # agent off with a notice (it is never called without an address); it
    # switches on, with no restart, once the record exists. A
    # webhook URL or token written here is refused at load.
    connector_config:
      connection: sla_watchdog_n8n
    yields:
      breached_count: "number"
      breached_ticket_ids: "list"
    inputs:
      trigger: "string"
    can_call: []
